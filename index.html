<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importar Vendas — Dom Leon (18/07 a 27/07)</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Inter',sans-serif;background:#F5F2ED;color:#2E2018;padding:24px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:20px;font-weight:600;margin-bottom:4px}
  .sub{color:#7A6B5D;font-size:13px;margin-bottom:20px}
  .card{background:#fff;border:1px solid #E4DCD0;border-radius:12px;padding:20px;margin-bottom:16px}
  button{padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:right;padding:8px 6px;color:#7A6B5D;border-bottom:1px solid #E4DCD0;font-weight:600}
  th:first-child,td:first-child{text-align:left}
  td{text-align:right;padding:6px 6px;border-bottom:1px solid #F0EBE2}
  tr.existe td{background:#FFF7E6}
  .badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
  .badge-novo{background:#E6F4E9;color:#2E7D45}
  .badge-existe{background:#FFF0CC;color:#966B0A}
  .totais{display:flex;gap:16px;margin:14px 0;flex-wrap:wrap}
  .tot{background:#F5F2ED;border-radius:8px;padding:10px 16px}
  .tot b{display:block;font-size:17px}
  .tot span{font-size:12px;color:#7A6B5D}
  #log{font-size:12px;color:#7A6B5D;margin-top:10px;white-space:pre-wrap}
  #status{font-size:13px;font-weight:600;margin-bottom:10px}
  .btn-import{background:#4A3728;color:#fff;width:100%;padding:14px;font-size:15px;margin-top:6px}
  .btn-import:disabled{background:#C9BCA8;cursor:not-allowed}
  .row{display:flex;gap:10px;margin-bottom:10px}
  input{flex:1;padding:10px 12px;border:1px solid #D8CFC0;border-radius:8px;font-size:14px}
  .btn-primary{background:#7C5C3E;color:#fff}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Importar vendas — Padaria Dom Leon</h1>
  <p class="sub">Relatório: 18/07/2026 a 27/07/2026 · 10 dias · Total geral R$ 10.558,26</p>

  <div id="login-card" class="card">
    <div class="row">
      <input type="email" id="email" placeholder="e-mail">
      <input type="password" id="senha" placeholder="senha">
      <button class="btn-primary" id="btn-login">Entrar</button>
    </div>
    <div id="login-msg" style="font-size:13px;color:#B23B3B"></div>
  </div>

  <div id="app-card" class="card hidden">
    <div id="status">Verificando quais datas já existem no Firestore...</div>
    <div class="totais" id="totais"></div>
    <table>
      <thead>
        <tr><th>Data</th><th>Prazo</th><th>Crédito</th><th>Débito</th><th>Dinheiro</th><th>Pix</th><th>Total</th><th>Status</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <button class="btn-import" id="btn-import" disabled>Importar 10 lançamentos para o Firestore</button>
    <div id="log"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC2ki-hUKAzEIxsvMUAqR19yvJ0D7GCq7w",
  authDomain: "monitor-dom-leon.firebaseapp.com",
  projectId: "monitor-dom-leon",
  storageBucket: "monitor-dom-leon.firebasestorage.app",
  messagingSenderId: "346093169564",
  appId: "1:346093169564:web:745f809636fa5bd4ae3659"
};
const app = firebase.initializeApp(firebaseConfig);
const db = app.firestore();
const auth = app.auth();

const brl = v => 'R$ ' + (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

// Dados extraídos do relatório "Cupons no Período de 18/07/2026 à 27/07/2026"
const DADOS = [{"data": "2026-07-18", "prazo": 137.02, "credito": 89.75, "debito": 1013.01, "dinheiro": 315.34, "pix": 146.53}, {"data": "2026-07-19", "prazo": 84.2, "credito": 69.3, "debito": 883.2, "dinheiro": 81.1, "pix": 134.85}, {"data": "2026-07-20", "prazo": 117.18, "credito": 71.0, "debito": 567.43, "dinheiro": 85.37, "pix": 0}, {"data": "2026-07-21", "prazo": 168.49, "credito": 140.36, "debito": 347.85, "dinheiro": 98.42, "pix": 72.68}, {"data": "2026-07-22", "prazo": 180.8, "credito": 26.5, "debito": 288.75, "dinheiro": 127.35, "pix": 40.62}, {"data": "2026-07-23", "prazo": 199.09, "credito": 69.47, "debito": 338.92, "dinheiro": 134.43, "pix": 58.87}, {"data": "2026-07-24", "prazo": 148.11, "credito": 0, "debito": 442.47, "dinheiro": 124.32, "pix": 20.13}, {"data": "2026-07-25", "prazo": 58.71, "credito": 218.66, "debito": 906.44, "dinheiro": 255.57, "pix": 72.35}, {"data": "2026-07-26", "prazo": 53.6, "credito": 20.8, "debito": 848.78, "dinheiro": 293.67, "pix": 159.65}, {"data": "2026-07-27", "prazo": 154.32, "credito": 106.14, "debito": 371.15, "dinheiro": 172.2, "pix": 43.31}];

async function montarPreview(){
  const tbody = document.getElementById('tbody');
  const status = document.getElementById('status');
  tbody.innerHTML = '';
  let novos = 0, existentes = 0, totalGeral = 0;

  for(const d of DADOS){
    const snap = await db.collection('entradas').doc(d.data).get();
    const existe = snap.exists;
    if(existe) existentes++; else novos++;
    const totalDia = d.prazo + d.credito + d.debito + d.dinheiro + d.pix;
    totalGeral += totalDia;

    const [ano,mes,dia] = d.data.split('-');
    const tr = document.createElement('tr');
    if(existe) tr.className = 'existe';
    tr.innerHTML = `
      <td>${dia}/${mes}</td>
      <td>${brl(d.prazo)}</td>
      <td>${brl(d.credito)}</td>
      <td>${brl(d.debito)}</td>
      <td>${brl(d.dinheiro)}</td>
      <td>${brl(d.pix)}</td>
      <td><b>${brl(totalDia)}</b></td>
      <td><span class="badge ${existe?'badge-existe':'badge-novo'}">${existe?'já existe':'novo'}</span></td>
    `;
    tbody.appendChild(tr);
  }

  document.getElementById('totais').innerHTML = `
    <div class="tot"><b>${DADOS.length}</b><span>dias no relatório</span></div>
    <div class="tot"><b style="color:#2E7D45">${novos}</b><span>novos</span></div>
    <div class="tot"><b style="color:#966B0A">${existentes}</b><span>já existem (serão sobrescritos)</span></div>
    <div class="tot"><b>${brl(totalGeral)}</b><span>total do período</span></div>
  `;
  status.textContent = 'Prévia carregada. Linhas em amarelo já têm lançamento e serão sobrescritas.';
  document.getElementById('btn-import').disabled = false;
}

document.getElementById('btn-import').onclick = async () => {
  const btn = document.getElementById('btn-import');
  const log = document.getElementById('log');
  if(!confirm(`Confirma a importação de ${DADOS.length} lançamentos? Dias já existentes serão sobrescritos (campo cortesia é preservado).`)) return;
  btn.disabled = true;
  btn.textContent = 'Importando...';
  log.textContent = '';

  let ok = 0, erro = 0;
  for(const d of DADOS){
    try{
      const ref = db.collection('entradas').doc(d.data);
      const snap = await ref.get();
      const cortesiaAtual = snap.exists ? (snap.data().cortesia || 0) : 0;
      await ref.set({
        data: d.data,
        prazo: d.prazo,
        credito: d.credito,
        debito: d.debito,
        dinheiro: d.dinheiro,
        pix: d.pix,
        cortesia: cortesiaAtual
      });
      ok++;
      log.textContent += `${d.data} ok\n`;
    }catch(e){
      erro++;
      log.textContent += `${d.data} ERRO: ${e.message}\n`;
    }
  }
  btn.textContent = `Importação concluída: ${ok} ok, ${erro} erro(s)`;
  log.textContent += `\nFinalizado. ${ok} lançamentos gravados, ${erro} erros.`;
};

document.getElementById('btn-login').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const msg = document.getElementById('login-msg');
  msg.textContent = '';
  try{
    await auth.signInWithEmailAndPassword(email, senha);
  }catch(e){
    msg.textContent = 'Erro no login: ' + e.message;
  }
};

auth.onAuthStateChanged(async user => {
  if(!user) return;
  document.getElementById('login-card').classList.add('hidden');
  document.getElementById('app-card').classList.remove('hidden');
  await montarPreview();
});
</script>
</body>
</html>
